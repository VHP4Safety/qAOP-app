<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>qAOP Prediction - Nephrotoxicity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="VHP4Safety Logo" class="center">
    <h2 class="subheader">This qAOP tool is under development</h2>

    <header>
        <h1>qAOP Prediction - Cisplatin-Induced Nephrotoxicity</h1>
    </header>

    <div class="container">
        <form method="POST">
            <label for="dose">
                Dose (μM):
                <sup><img src="{{ url_for('static', filename='img/question-circle.svg') }}" 
                     alt="tooltip" width="12" height="12" 
                     title="Enter the cisplatin dose in micromolar (μM). Example: 50"></sup>
            </label><br>
            <input type="number" name="dose" id="dose" step="any" required value="50"><br><br>
        
            <label for="time">
                Time (hours):
                <sup><img src="{{ url_for('static', filename='img/question-circle.svg') }}" 
                     alt="tooltip" width="12" height="12" 
                     title="Enter the time after cisplatin exposure, in hours. Example: 24"></sup>
            </label><br>
            <input type="number" name="time" id="time" step="any" required value="24"><br><br>
        
            <label for="target">
                Target:
                <sup><img src="{{ url_for('static', filename='img/question-circle.svg') }}" 
                     alt="tooltip" width="12" height="12" 
                     title="Choose which effect to predict: DNA Damage (EGs score) or Necrosis (% cell death)."></sup>
            </label><br>
            <select name="target" id="target" required>
                <option value="">--Select--</option>
                <option value="DNA Damage" {% if request.form.get('target') == 'DNA Damage' or not request.form.get('target') %}selected{% endif %}>DNA Damage</option>
                <option value="Necrosis" {% if request.form.get('target') == 'Necrosis' %}selected{% endif %}>Necrosis</option>
            </select>
            <br><br>
        
            <input type="submit" value="Run Simulation">
        </form>
        {% if result %}
        <h3>Result</h3>
        <p>{{ result }}</p>
        {% if image %}
        <img src="data:image/png;base64,{{ image }}" alt="Distribution Plot" style="width:100%; max-width: 700px;">
        {% endif %}
        {% endif %}
    </div>

    <footer>
        <p class="footer-content">
            View the source code on&nbsp<a href="https://github.com/VHP4Safety/qAOP-predictor" target="_blank">GitHub</a>&nbsp
        </p>
    </footer>
</body>
</html>
